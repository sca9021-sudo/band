<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밴드 연습 기록소</title>
    <!-- 차트를 그리기 위한 Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
        .feed { margin-top: 40px; }
        .log-card { background: #f9f9f9; border-left: 5px solid #3498db; padding: 15px; margin-bottom: 15px; border-radius: 4px; position: relative; }
        .log-header { font-size: 0.9em; color: #7f8c8d; margin-bottom: 8px; }
        
        .category-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; color: white; font-size: 0.8em; font-weight: bold; margin-right: 5px; }
        .btn-delete { position: absolute; top: 15px; right: 15px; width: auto; padding: 5px 10px; background-color: #e74c3c; font-size: 12px; }
        .btn-delete:hover { background-color: #c0392b; }

        .settings-section { margin-top: 50px; padding: 20px; background-color: #ecf0f1; border-radius: 8px; }
        .settings-grid { display: flex; gap: 20px; }
        .settings-col { flex: 1; background: white; padding: 15px; border-radius: 5px; }
        .settings-list { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 150px; overflow-y: auto; }
        .settings-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .btn-small { width: auto; padding: 4px 8px; font-size: 12px; background-color: #e74c3c; }
        .input-row { display: flex; gap: 5px; }
        .input-row input { flex: 1; }
        .input-row button { width: 60px; padding: 10px; }
        input[type="color"] { width: 40px; padding: 0; border: none; background: none; cursor: pointer; height: 40px; }
        .week-indicator { text-align: center; color: #7f8c8d; font-size: 0.9em; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎸 밴드 연습 기록소</h1>
    
    <!-- 주간 목표 차트 영역 -->
    <h2 id="chartTitle">이번 주 연습량</h2>
    <div id="weekRange" class="week-indicator"></div>
    <div class="chart-container">
        <canvas id="practiceChart"></canvas>
    </div>

    <!-- 연습 기록 입력 폼 -->
    <h2 style="margin-top: 40px;">새 연습 기록하기</h2>
    <div class="form-group">
        <label>멤버 이름 (파트)</label>
        <select id="memberName"></select>
    </div>
    <div class="form-group">
        <label>연습 카테고리</label>
        <select id="practiceCategory"></select>
    </div>
    <div class="form-group">
        <label>연습 시간 (분)</label>
        <input type="number" id="practiceTime" placeholder="예: 90" required>
    </div>
    <div class="form-group">
        <label>연습 내용 / 코멘트</label>
        <textarea id="comment" rows="3" placeholder="어떤 연습을 했는지 남겨주세요." required></textarea>
    </div>
    <button onclick="saveLog()">기록 올리기</button>

    <!-- 기록 피드 영역 -->
    <div class="feed" id="feedContainer">
        <h2>전체 연습 기록</h2>
    </div>

    <!-- 설정 영역 -->
    <div class="settings-section">
        <h3>⚙️ 설정 (멤버 및 카테고리 관리)</h3>
        <div class="settings-grid">
            <div class="settings-col">
                <h4>멤버 관리</h4>
                <ul class="settings-list" id="memberList"></ul>
                <div class="input-row">
                    <input type="text" id="newMemberInput" placeholder="새 멤버 입력">
                    <button onclick="addMember()">추가</button>
                </div>
            </div>
            <div class="settings-col">
                <h4>카테고리 관리</h4>
                <ul class="settings-list" id="categoryList"></ul>
                <div class="input-row">
                    <input type="color" id="newCategoryColor" value="#3498db">
                    <input type="text" id="newCategoryInput" placeholder="새 카테고리 입력">
                    <button onclick="addCategory()">추가</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('bandPracticeLogs')) || [];
    let members = JSON.parse(localStorage.getItem('bandMembers')) || ['보컬', '기타', '베이스', '드럼', '키보드'];
    let categories = JSON.parse(localStorage.getItem('bandCategories')) || [
        { name: '개인 연습', color: '#3498db' },
        { name: '곡 카피', color: '#2ecc71' },
        { name: '합주', color: '#e67e22' },
        { name: '톤 세팅', color: '#9b59b6' }
    ];
    let myChart = null;

    updateUI();

    // 이번 주 월요일 0시 0분 0초의 타임스탬프를 구하는 함수
    function getRecentMondayTime() {
        const now = new Date();
        const day = now.getDay(); // 0(일) ~ 6(토)
        const diff = day === 0 ? 6 : day - 1; // 월요일(1)로부터 며칠 떨어져 있는지 계산
        
        const monday = new Date(now);
        monday.setDate(now.getDate() - diff);
        monday.setHours(0, 0, 0, 0); // 시간을 0시 0분 0초로 초기화
        
        return monday.getTime();
    }

    // 화면에 보여줄 이번 주 날짜 문자열 생성 (예: 8/12 ~ 8/18)
    function updateWeekIndicator() {
        const monday = new Date(getRecentMondayTime());
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        
        const format = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
        document.getElementById('weekRange').innerText = `(${format(monday)} 월요일 ~ ${format(sunday)} 일요일)`;
    }

    function saveSettings() {
        localStorage.setItem('bandMembers', JSON.stringify(members));
        localStorage.setItem('bandCategories', JSON.stringify(categories));
        updateUI();
    }

    function addMember() {
        const input = document.getElementById('newMemberInput');
        const name = input.value.trim();
        if (name && !members.includes(name)) {
            members.push(name);
            input.value = '';
            saveSettings();
        }
    }

    function removeMember(name) {
        if(confirm(`'${name}' 멤버를 삭제하시겠습니까? (기존 기록은 피드에 남습니다)`)) {
            members = members.filter(m => m !== name);
            saveSettings();
        }
    }

    function addCategory() {
        const nameInput = document.getElementById('newCategoryInput');
        const colorInput = document.getElementById('newCategoryColor');
        const name = nameInput.value.trim();
        if (name && !categories.some(c => c.name === name)) {
            categories.push({ name: name, color: colorInput.value });
            nameInput.value = '';
            saveSettings();
        }
    }

    function removeCategory(name) {
        if(confirm(`'${name}' 카테고리를 삭제하시겠습니까? (기존 기록은 피드에 남습니다)`)) {
            categories = categories.filter(c => c.name !== name);
            saveSettings();
        }
    }

    function saveLog() {
        const name = document.getElementById('memberName').value;
        const category = document.getElementById('practiceCategory').value;
        const time = parseInt(document.getElementById('practiceTime').value);
        const comment = document.getElementById('comment').value;

        if(!name || !category) { alert('멤버와 카테고리를 설정에서 등록해주세요!'); return; }
        if(!time || !comment) { alert('시간과 코멘트를 입력해주세요!'); return; }

        const newLog = {
            id: Date.now(), // 고유 ID이자 타임스탬프로 사용됨
            name: name,
            category: category,
            time: time,
            comment: comment,
            date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        };

        logs.unshift(newLog); 
        localStorage.setItem('bandPracticeLogs', JSON.stringify(logs));
        
        document.getElementById('practiceTime').value = '';
        document.getElementById('comment').value = '';

        updateUI();
    }

    function deleteLog(id) {
        if(confirm('이 기록을 정말 삭제하시겠습니까?')) {
            logs = logs.filter(log => log.id !== id);
            localStorage.setItem('bandPracticeLogs', JSON.stringify(logs));
            updateUI();
        }
    }

    function updateUI() {
        renderDropdowns();
        renderSettingsList();
        renderFeed();
        updateWeekIndicator();
        renderChart();
    }

    function renderDropdowns() {
        const memberSelect = document.getElementById('memberName');
        memberSelect.innerHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
        const catSelect = document.getElementById('practiceCategory');
        catSelect.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    function renderSettingsList() {
        document.getElementById('memberList').innerHTML = members.map(m => `
            <li>${m} <button class="btn-small btn-delete" style="position:static;" onclick="removeMember('${m}')">삭제</button></li>
        `).join('');
        document.getElementById('categoryList').innerHTML = categories.map(c => `
            <li><span><span class="category-badge" style="background-color: ${c.color}">${c.name}</span></span>
            <button class="btn-small btn-delete" style="position:static;" onclick="removeCategory('${c.name}')">삭제</button></li>
        `).join('');
    }

    function renderFeed() {
        const container = document.getElementById('feedContainer');
        container.innerHTML = '<h2>전체 연습 기록</h2>';
        
        if (logs.length === 0) {
            container.innerHTML += '<p style="text-align:center; color:#999;">아직 등록된 연습 기록이 없습니다.</p>';
            return;
        }

        logs.forEach(log => {
            const catObj = categories.find(c => c.name === log.category);
            const color = catObj ? catObj.color : '#7f8c8d'; 

            container.innerHTML += `
                <div class="log-card" style="border-left-color: ${color}">
                    <button class="btn-delete" onclick="deleteLog(${log.id})">삭제</button>
                    <div class="log-header">
                        <span class="category-badge" style="background-color: ${color}">${log.category || '기타'}</span>
                        <strong>${log.name}</strong> | ${log.date} | ⏱️ ${log.time}분
                    </div>
                    <div>${log.comment}</div>
                </div>
            `;
        });
    }

    function renderChart() {
        // [핵심 변경점] 이번 주 월요일 0시 이후의 데이터만 필터링합니다.
        const recentMonday = getRecentMondayTime();
        const thisWeekLogs = logs.filter(log => log.id >= recentMonday);

        const datasets = categories.map(cat => {
            return {
                label: cat.name,
                data: members.map(() => 0),
                backgroundColor: cat.color
            };
        });

        // 전체 logs가 아닌 thisWeekLogs(이번 주 기록)만 더해서 차트를 만듭니다.
        thisWeekLogs.forEach(log => {
            const memberIndex = members.indexOf(log.name);
            const dataset = datasets.find(d => d.label === log.category);
            if (memberIndex !== -1 && dataset) {
                dataset.data[memberIndex] += log.time;
            }
        });

        const ctx = document.getElementById('practiceChart').getContext('2d');
        if(myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: members,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true },
                    y: { 
                        stacked: true,
                        beginAtZero: true,
                        max: 600
                    }
                }
            }
        });
    }
</script>

</body>
</html>
